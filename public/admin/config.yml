# Decap CMS — lets the founders add and remove portfolio projects and blog articles at /admin.
# Signing in uses GitHub (via Netlify's OAuth provider). Every save commits to
# `main` in kelbari-agency/kelbari, which triggers a production deploy.

backend:
  name: github
  repo: kelbari-agency/kelbari
  branch: main
  commit_messages:
    create: "Add work: {{slug}}"
    update: "Update work: {{slug}}"
    delete: "Remove work: {{slug}}"
    uploadMedia: "Upload image: {{path}}"
    deleteMedia: "Remove image: {{path}}"

site_url: https://kelbari.net
display_url: https://kelbari.net
logo_url: https://kelbari.net/assets/brand/icon-512.png

publish_mode: simple
locale: en

# Images are saved in the repo and served from /images/uploads/.
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: work
    label: Selected work
    files:
      - name: projects
        label: Projects
        file: public/data/projects.json
        format: json
        fields:
          - label: Projects
            name: projects
            widget: list
            label_singular: project
            summary: "{{fields.title}}"
            hint: "Add a project, or delete one with the trash icon. Click Publish when you're done."
            fields:
              - { label: Title, name: title, widget: string }
              - label: Category
                name: category
                widget: select
                options:
                  - Web development
                  - SaaS
                  - Digital marketing
                  - Graphic design
                  - Full brand system
              - { label: Client, name: client, widget: string, required: false }
              - { label: Location, name: location, widget: string, required: false, hint: "City and country, e.g. Bahawalpur, Pakistan" }
              - label: Description
                name: description
                widget: text
                hint: "Two or three sentences: what you made, and what changed for the client."
              - label: What we built
                name: highlights
                widget: list
                required: false
                hint: "Three or four short points. One feature per line."
                field: { label: Point, name: item, widget: string }
              - label: Built with
                name: built_with
                widget: list
                required: false
                hint: "Tools and platforms, e.g. WordPress, WooCommerce"
                field: { label: Tool, name: tool, widget: string }
              - label: Cover image
                name: image
                widget: image
                required: false
                hint: "Landscape works best (16:10). Shown at the top of the card."
              - label: Link
                name: link
                widget: string
                required: false
                hint: "Optional. The live site, starting with https://"
              - label: Page address
                name: slug
                widget: string
                required: false
                pattern: ['^[a-z0-9-]*$', "Lowercase letters, numbers and dashes only"]
                hint: "Needed for a gallery. Short name for the project's address, e.g. fancourt opens kelbari.net/#work/fancourt"
              - label: Gallery
                name: gallery
                widget: list
                required: false
                hint: "Optional. Full-width images shown in order when someone opens the project on this site. Use either a gallery or a link."
                fields:
                  - { label: Image, name: image, widget: image }
                  - { label: Width (px), name: width, widget: number, required: false, value_type: int }
                  - { label: Height (px), name: height, widget: number, required: false, value_type: int }
                pattern: ["^https?://.+", "Start the address with https://"]

  # Blog articles: one Markdown file per article in tools/content/blog/. The file name is the
  # address: tools/content/blog/website-cost.md is published at kelbari.net/blog/website-cost/.
  - name: blog
    label: Blog
    label_singular: article
    folder: tools/content/blog
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} ({{date}})"
    sortable_fields: [date, title]
    fields:
      - { label: Title, name: title, widget: string, hint: "Up to about 60 characters. Becomes the page heading and the title in Google." }
      - { label: Description, name: description, widget: text, hint: "One sentence of 140 to 160 characters. Shown under the title and in Google results." }
      - { label: Published, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: Updated, name: updated, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false, hint: "Only when you make a real change to an older article." }
      - { label: Author, name: author, widget: select, options: [Kelbari, Saqlain Akbar, Hafiz Ahmad], default: Kelbari }
      - { label: Category, name: category, widget: select, options: [Web development, SaaS, Digital marketing, AI, Graphic design] }
      - label: Related service
        name: service
        widget: select
        hint: "The article is listed under Guides on this service page."
        options:
          - { label: Web development, value: web-development }
          - { label: SaaS, value: saas }
          - { label: Digital marketing, value: digital-marketing }
          - { label: Graphic design, value: graphic-design }
      - { label: Keywords, name: keywords, widget: list, required: false, hint: "The searches this article is written for, e.g. website cost in Pakistan" }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false, hint: "Drafts are saved but not published." }
      - { label: Article, name: body, widget: markdown, hint: "Start with a short answer. Use Heading 2 for sections and Heading 3 inside them. Don't add the title again." }
