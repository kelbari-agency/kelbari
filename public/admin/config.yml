# Decap CMS — lets the founders add and remove portfolio projects at /admin.
# Signing in uses GitHub (via Netlify's OAuth provider). Every save commits to
# `main` in kelbari-agency/kelbari, which triggers a production deploy.

backend:
  name: github
  repo: kelbari-agency/kelbari
  branch: main
  commit_messages:
    create: "Add work: {{slug}}"
    update: "Update work: {{slug}}"
    delete: "Remove work: {{slug}}"
    uploadMedia: "Upload image: {{path}}"
    deleteMedia: "Remove image: {{path}}"

site_url: https://kelbari.net
display_url: https://kelbari.net
logo_url: https://kelbari.net/assets/brand/icon-512.png

publish_mode: simple
locale: en

# Images are saved in the repo and served from /images/uploads/.
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: work
    label: Selected work
    files:
      - name: projects
        label: Projects
        file: public/data/projects.json
        format: json
        fields:
          - label: Projects
            name: projects
            widget: list
            label_singular: project
            summary: "{{fields.title}}"
            hint: "Add a project, or delete one with the trash icon. Click Publish when you're done."
            fields:
              - { label: Title, name: title, widget: string }
              - label: Category
                name: category
                widget: select
                options:
                  - Web development
                  - Digital marketing
                  - Graphic design
                  - Full brand system
              - { label: Client, name: client, widget: string, required: false }
              - { label: Location, name: location, widget: string, required: false, hint: "City and country, e.g. Bahawalpur, Pakistan" }
              - label: Description
                name: description
                widget: text
                hint: "Two or three sentences: what you made, and what changed for the client."
              - label: What we built
                name: highlights
                widget: list
                required: false
                hint: "Three or four short points. One feature per line."
                field: { label: Point, name: item, widget: string }
              - label: Built with
                name: built_with
                widget: list
                required: false
                hint: "Tools and platforms, e.g. WordPress, WooCommerce"
                field: { label: Tool, name: tool, widget: string }
              - label: Cover image
                name: image
                widget: image
                required: false
                hint: "Landscape works best (16:10). Shown at the top of the card."
              - label: Link
                name: link
                widget: string
                required: false
                hint: "Optional. The live site, starting with https://"
                pattern: ["^https?://.+", "Start the address with https://"]
