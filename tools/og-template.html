<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Bricolage Grotesque";src:url("../public/assets/fonts/bricolage-grotesque-latin-opsz-normal.woff2") format("woff2");font-weight:200 800}
@font-face{font-family:"Geist";src:url("../public/assets/fonts/geist-latin-wght-normal.woff2") format("woff2");font-weight:100 900}
html,body{margin:0;padding:0}
body{width:1200px;height:630px;background:#F8F8FC;position:relative;overflow:hidden;font-family:"Geist",sans-serif;color:#12133B}
.lockup{position:absolute;left:72px;top:64px;display:flex;align-items:center;gap:14px;font:700 34px/1 "Bricolage Grotesque";letter-spacing:-.03em}
.chips{position:absolute;left:72px;top:140px;display:flex;gap:8px}
.chips span{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px #DADBEE;font:500 16px/1 "Geist"}
.chips span::before{content:"";width:8px;height:8px;border-radius:50%;background:#3B36F4}
h1{position:absolute;left:72px;top:200px;margin:0;width:620px;font:800 82px/.9 "Bricolage Grotesque";letter-spacing:-.05em}
.url{position:absolute;left:72px;bottom:58px;font:500 22px/1 "Geist";color:#555878}
.tile{position:absolute;right:56px;top:56px;width:440px;height:518px;border-radius:36px;background:#12133B;overflow:hidden}
.tile::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 60% at 55% 50%,rgba(139,136,255,.25),transparent 70%)}
#net{position:absolute;inset:0;z-index:1}
</style>
</head>
<body>
<div class="lockup">
  <svg width="48" height="48" viewBox="0 0 64 64"><g stroke="#12133B" stroke-width="4" stroke-linecap="round"><path d="M14 12V52"/><path d="M14 32L48 12"/><path d="M14 32L48 52"/></g><circle cx="14" cy="12" r="6" fill="#12133B"/><circle cx="14" cy="52" r="6" fill="#12133B"/><circle cx="48" cy="12" r="6" fill="#3B36F4"/><circle cx="48" cy="52" r="6" fill="#3B36F4"/><circle cx="14" cy="32" r="5" fill="#F8F8FC" stroke="#12133B" stroke-width="3"/></svg>
  Kelbari
</div>
<div class="chips"><span>Web development</span><span>Digital marketing</span><span>Graphic design</span></div>
<h1>Sites, campaigns and design from one team.</h1>
<div class="url">kelbari.net</div>
<div class="tile"><svg id="net" width="440" height="518" viewBox="0 0 440 518"></svg></div>
<script>
// Same idea as the live hero tile: the K mark is the seed, the network grows out of it.
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("net");
const W=440,H=518,U=3.6, OX=W/2-31*U, OY=H/2-32*U;
const g=(x,y)=>({x:OX+x*U,y:OY+y*U});
const seeds=[g(48,12),g(48,52),g(14,12),g(14,52)];
const keep={l:OX+(8-10)*U,r:OX+(54+10)*U,t:OY+(6-10)*U,b:OY+(58+10)*U};
let s=11;const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const pts=[];let tries=0;
while(pts.length<30&&tries<5000){tries++;
  const x=16+rnd()*(W-32),y=16+rnd()*(H-32);
  if(x>keep.l&&x<keep.r&&y>keep.t&&y<keep.b)continue;
  if(pts.some(p=>Math.hypot(p.x-x,p.y-y)<56))continue;
  pts.push({x,y,r:1.8+rnd()*2.2,c:rnd()});}
const mk=(tag,a)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e};
const LINK=120;
for(const p of pts){let b=null,bd=1e9;for(const q of seeds){const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;b=q}}
  const a=Math.max(0,1.1-bd/260)*0.3;if(a>.02)mk("line",{x1:b.x,y1:b.y,x2:p.x,y2:p.y,stroke:"#8B88FF","stroke-opacity":a,"stroke-width":1.4});}
for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);
  if(d<LINK)mk("line",{x1:pts[i].x,y1:pts[i].y,x2:pts[j].x,y2:pts[j].y,stroke:"#8B88FF","stroke-opacity":(1-d/LINK)*0.32,"stroke-width":1.4});}
for(const p of pts){const c=p.c<.3?["#8B88FF",.95]:p.c<.65?["#ECECFE",.6]:["#B8B9D6",.6];
  mk("circle",{cx:p.x,cy:p.y,r:p.r*1.15,fill:c[0],"fill-opacity":c[1]});}
const k=mk("g",{transform:`translate(${OX} ${OY}) scale(${U})`});
k.innerHTML='<g stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M14 12V52"/><path d="M14 32L48 12"/><path d="M14 32L48 52"/></g><circle cx="14" cy="12" r="6" fill="#fff"/><circle cx="14" cy="52" r="6" fill="#fff"/><circle cx="48" cy="12" r="6" fill="#8B88FF"/><circle cx="48" cy="52" r="6" fill="#8B88FF"/><circle cx="14" cy="32" r="5" fill="#12133B" stroke="#fff" stroke-width="3"/>';
</script>
</body>
</html>
