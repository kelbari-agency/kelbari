<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Manrope";src:url("../public/assets/fonts/manrope-latin-wght-normal.woff2") format("woff2");font-weight:200 800}
@font-face{font-family:"JetBrains Mono";src:url("../public/assets/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2");font-weight:400}
html,body{margin:0;padding:0}
body{width:1200px;height:630px;background:#07322F;position:relative;overflow:hidden;font-family:"Manrope",sans-serif;color:#fff}
#net{position:absolute;inset:0}
.lockup{position:absolute;left:80px;top:64px;display:flex;align-items:center;gap:16px;font-weight:800;font-size:40px;letter-spacing:-.03em}
h1{position:absolute;left:80px;top:200px;margin:0;width:600px;font-weight:800;font-size:72px;line-height:1.04;letter-spacing:-.035em}
.rule{position:absolute;left:80px;top:446px;width:64px;height:4px;background:#34D3B4}
.tag{position:absolute;left:80px;top:482px;font-weight:600;font-size:22px;color:#34D3B4}
.url{position:absolute;right:80px;bottom:56px;font-family:"JetBrains Mono",monospace;font-size:22px;color:#A9B4B1}
</style>
</head>
<body>
<svg id="net" width="1200" height="630" viewBox="0 0 1200 630"></svg>
<div class="lockup">
  <svg width="56" height="56" viewBox="0 0 64 64"><g stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M14 12V52"/><path d="M14 32L48 12"/><path d="M14 32L48 52"/></g><circle cx="14" cy="12" r="6" fill="#fff"/><circle cx="14" cy="52" r="6" fill="#fff"/><circle cx="48" cy="12" r="6" fill="#34D3B4"/><circle cx="48" cy="52" r="6" fill="#34D3B4"/><circle cx="14" cy="32" r="5" fill="#07322F" stroke="#fff" stroke-width="3"/></svg>
  Kelbari
</div>
<h1>Sites, campaigns and design from one team.</h1>
<div class="rule"></div>
<div class="tag">Web development · Social media marketing · Graphic design</div>
<div class="url">kelbari.net</div>
<script>
// Same idea as the live hero: the K mark is the seed, the network grows out of it.
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("net");
const U=5.9, OX=900-32*U, OY=315-32*U;           // K on its 64-unit grid, centred at (900,315)
const g=(x,y)=>({x:OX+x*U,y:OY+y*U});
const seeds=[g(48,12),g(48,52),g(14,12),g(14,52)];
const keep={l:OX+(8-12)*U,r:OX+(54+12)*U,t:OY+(6-12)*U,b:OY+(58+12)*U};
let s=11;const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const pts=[];let tries=0;
while(pts.length<46&&tries<4000){tries++;
  const x=560+rnd()*640,y=rnd()*630;
  if(x>keep.l&&x<keep.r&&y>keep.t&&y<keep.b)continue;
  if(pts.some(p=>Math.hypot(p.x-x,p.y-y)<58))continue;
  pts.push({x,y,r:1.6+rnd()*2.2,c:rnd()});}
const mk=(tag,a)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e};
const LINK=150;
for(const p of pts){let b=null,bd=1e9;for(const q of seeds){const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;b=q}}
  const a=Math.max(0,1.1-bd/330)*0.26;if(a>.02)mk("line",{x1:b.x,y1:b.y,x2:p.x,y2:p.y,stroke:"#34D3B4","stroke-opacity":a,"stroke-width":1.4});}
for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);
  if(d<LINK)mk("line",{x1:pts[i].x,y1:pts[i].y,x2:pts[j].x,y2:pts[j].y,stroke:"#34D3B4","stroke-opacity":(1-d/LINK)*0.28,"stroke-width":1.4});}
for(const p of pts){const c=p.c<.26?["#34D3B4",.9]:p.c<.62?["#E3F7F2",.6]:["#A9B4B1",.6];
  mk("circle",{cx:p.x,cy:p.y,r:p.r*1.15,fill:c[0],"fill-opacity":c[1]});}
// the mark itself (exact geometry)
const k=mk("g",{transform:`translate(${OX} ${OY}) scale(${U})`});
k.innerHTML='<g stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M14 12V52"/><path d="M14 32L48 12"/><path d="M14 32L48 52"/></g><circle cx="14" cy="12" r="6" fill="#fff"/><circle cx="14" cy="52" r="6" fill="#fff"/><circle cx="48" cy="12" r="6" fill="#34D3B4"/><circle cx="48" cy="52" r="6" fill="#34D3B4"/><circle cx="14" cy="32" r="5" fill="#07322F" stroke="#fff" stroke-width="3"/>';
</script>
</body>
</html>
