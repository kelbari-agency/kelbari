# TEMPORARY one-off: copies the project showcases from seeratali.netlify.app into
# this repo as optimised WebP slices. Deleted once it has run.
name: Import portfolio showcases
on:
  push:
    branches: [redesign]
    paths: [.github/workflows/import-portfolio.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: redesign }
      - run: pip install pillow==11.0.0
      - name: Download and slice
        run: |
          python3 - <<'PY'
          import io, json, os, urllib.request
          from PIL import Image
          Image.MAX_IMAGE_PIXELS = None
          SRC = {"brighter-strides":"brighterstrides","tiernan-travels":"tiernan","quizpur":"quizpur","maiva":"maiva",
                 "qayas-design-studio":"qayas","apartment-maid":"apartment-maid","babyresume":"babyresume",
                 "fancourt":"fancourt","pmhoa-pro":"pmhoa"}
          out = {}
          for slug, name in SRC.items():
              url = f"https://seeratali.netlify.app/assets/{name}-showcase.png"
              im = Image.open(io.BytesIO(urllib.request.urlopen(url, timeout=120).read())).convert("RGB")
              if im.width != 1366:
                  im = im.resize((1366, round(im.height * 1366 / im.width)), Image.LANCZOS)
              d = f"public/images/work/{slug}"; os.makedirs(d, exist_ok=True)
              parts, y, i, CH = [], 0, 1, 1400
              while y < im.height:
                  h = min(CH, im.height - y)
                  if im.height - (y + h) < 300: h = im.height - y
                  piece = im.crop((0, y, 1366, y + h))
                  piece.save(f"{d}/{i:02d}.webp", "WEBP", quality=80, method=6)
                  parts.append({"src": f"/images/work/{slug}/{i:02d}.webp", "w": 1366, "h": h})
                  y += h; i += 1
              # small preview of the full page for contact sheets
              im.resize((300, round(im.height * 300 / 1366)), Image.LANCZOS).save(f"{d}/_overview.jpg", quality=70)
              out[slug] = parts
              print(slug, im.size, len(parts))
          json.dump(out, open("public/images/work/showcases.json", "w"), indent=1)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/work
          git commit -m "Add project showcases imported from seeratali.netlify.app (optimised WebP)"
          git push origin HEAD:redesign
